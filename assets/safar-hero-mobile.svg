<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="cave" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b0e"/><stop offset=".52" stop-color="#171c22"/><stop offset="1" stop-color="#07090c"/></linearGradient>
  <linearGradient id="opening" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d6dce0"/><stop offset=".48" stop-color="#87939d"/><stop offset="1" stop-color="#343b42"/></linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b6a184"/><stop offset="1" stop-color="#343b40"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#f3e8d2" stop-opacity=".92"/><stop offset=".36" stop-color="#d7dfe4" stop-opacity=".42"/><stop offset="1" stop-color="#aab7c1" stop-opacity="0"/></radialGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#05080b" stop-opacity=".5"/><stop offset=".5" stop-color="#070b10" stop-opacity=".06"/><stop offset="1" stop-color="#05080b" stop-opacity=".56"/></linearGradient>
</defs>
<rect width="900" height="1600" fill="url(#cave)"/>
<!-- distant opening -->
<path d="M220 0H700Q810 100 760 310Q720 480 590 580H300Q160 470 140 300Q110 120 220 0Z" fill="url(#opening)" opacity=".92"/>
<ellipse cx="455" cy="290" rx="280" ry="310" fill="url(#glow)"/>
<circle cx="465" cy="255" r="58" fill="#e7e9e7" opacity=".72"/>
