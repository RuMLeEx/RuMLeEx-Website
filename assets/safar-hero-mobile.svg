<path d="M0 0H300Q210 180 280 370Q340 540 250 720Q170 920 0 1020Z" fill="#090d11"/>
<path d="M900 0H620Q710 180 640 370Q570 550 680 760Q790 940 900 1040Z" fill="#090d11"/>
